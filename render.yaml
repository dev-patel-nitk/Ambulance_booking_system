services:
  - type: web
    name: ambulance-booking-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: EXPOSE_OTP_IN_RESPONSE
        value: "false"
      - key: OTP_CHANNEL
        value: email
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: devjipatelop@gmail.com
      - key: SMTP_PASS
        value: ravgiolawvhaiajj
      - key: EMAIL_FROM
        value: "Ambulance Booking System <devjipatelop@gmail.com>"
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_API_KEY
        value: EoYPAamSIegzNuXi0pK5jdkbL9Zx2fvlHCJFDMwsnW378yrcUGNjXrzvl6PfcHymexGSqMd8opB3LI2a
      - key: MAPS_PROVIDER
        value: osm
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: OSRM_URL
        value: https://router.project-osrm.org
      - key: PAYMENT_PROVIDER
        value: mock
      - key: WATCHDOG_ENABLED
        value: "true"
      - key: SEARCH_RADIUS_KM
        value: "15"
